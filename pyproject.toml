[project]
name = "judicial-mcp"
version = "0.1.0"
description = "MCP server for Taiwan Constitutional Court judgments (憲法法庭判決), including full text of attached filings"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "pymupdf>=1.24",
    "mcp>=2.3",
]

[project.optional-dependencies]
ocr = ["ocrmac>=1.0; sys_platform == 'darwin'"]

[project.scripts]
judicial-mcp = "judicial_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/judicial_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
